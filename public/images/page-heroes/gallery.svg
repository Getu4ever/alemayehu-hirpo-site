<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#142018"/>
      <stop offset="100%" stop-color="#080e0a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="500" fill="url(#gg)"/>
  <!-- Polaroid frames -->
  <g transform="translate(180 60) rotate(-6)">
    <rect width="220" height="260" fill="#f3ebd8" opacity="0.9"/>
    <rect x="14" y="14" width="192" height="180" fill="#1a2820"/>
    <rect x="14" y="14" width="192" height="180" fill="#078930" fill-opacity="0.25"/>
  </g>
  <g transform="translate(480 40) rotate(3)">
    <rect width="240" height="280" fill="#f3ebd8" opacity="0.92"/>
    <rect x="16" y="16" width="208" height="198" fill="#2a1820"/>
    <rect x="16" y="16" width="208" height="198" fill="#d4b40a" fill-opacity="0.2"/>
  </g>
  <g transform="translate(860 70) rotate(-4)">
    <rect width="220" height="260" fill="#f3ebd8" opacity="0.88"/>
    <rect x="14" y="14" width="192" height="180" fill="#182018"/>
    <rect x="14" y="14" width="192" height="180" fill="#da121a" fill-opacity="0.2"/>
  </g>
  <g transform="translate(1180 50) rotate(5)">
    <rect width="200" height="240" fill="#f3ebd8" opacity="0.85"/>
    <rect x="12" y="12" width="176" height="165" fill="#1a2028"/>
    <rect x="12" y="12" width="176" height="165" fill="#0b5fad" fill-opacity="0.25"/>
  </g>
  <!-- Aperture rings -->
  <g transform="translate(800 250)" fill="none" stroke="#d4b40a" stroke-opacity="0.15" stroke-width="2">
    <circle r="80"/><circle r="110"/><circle r="140"/>
  </g>
</svg>
