<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#0a1a12"/>
      <stop offset="45%" stop-color="#1a2818"/>
      <stop offset="100%" stop-color="#2a1418"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="500" fill="url(#tg)"/>
  <!-- Road / route line -->
  <path d="M80 320 C280 280 420 360 600 300 C780 240 900 340 1100 280 C1280 230 1420 300 1560 260"
        fill="none" stroke="#d4b40a" stroke-width="3" stroke-opacity="0.45" stroke-dasharray="14 10"/>
  <!-- City pins -->
  <g fill="#d4b40a">
    <circle cx="280" cy="290" r="8"/><circle cx="280" cy="290" r="16" fill="none" stroke="#d4b40a" stroke-opacity="0.4"/>
    <circle cx="600" cy="300" r="8"/><circle cx="600" cy="300" r="16" fill="none" stroke="#d4b40a" stroke-opacity="0.4"/>
    <circle cx="1100" cy="280" r="8"/><circle cx="1100" cy="280" r="16" fill="none" stroke="#d4b40a" stroke-opacity="0.4"/>
  </g>
  <text x="250" y="260" fill="#f3ebd8" fill-opacity="0.35" font-family="Helvetica, Arial, sans-serif" font-size="14">ADDIS</text>
  <text x="560" y="270" fill="#f3ebd8" fill-opacity="0.35" font-family="Helvetica, Arial, sans-serif" font-size="14">DIASPORA</text>
  <text x="1050" y="250" fill="#f3ebd8" fill-opacity="0.35" font-family="Helvetica, Arial, sans-serif" font-size="14">WORLD</text>
  <!-- Soft globe arc -->
  <ellipse cx="1200" cy="200" rx="280" ry="160" fill="none" stroke="#078930" stroke-opacity="0.2" stroke-width="2"/>
  <text x="80" y="160" fill="#f3ebd8" fill-opacity="0.06" font-family="Georgia, serif" font-size="100">TOUR</text>
</svg>
