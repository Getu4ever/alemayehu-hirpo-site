<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="eg" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#3a1820"/>
      <stop offset="55%" stop-color="#0e1a12"/>
      <stop offset="100%" stop-color="#050a07"/>
    </radialGradient>
    <radialGradient id="spot" cx="50%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#fcdd09" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fcdd09" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="500" fill="url(#eg)"/>
  <ellipse cx="800" cy="0" rx="420" ry="220" fill="url(#spot)"/>
  <!-- Stage platform -->
  <path d="M200 380 L1400 380 L1500 500 L100 500 Z" fill="#0a120c" opacity="0.85"/>
  <path d="M200 380 L1400 380" stroke="#d4b40a" stroke-opacity="0.4" stroke-width="2"/>
  <!-- Mic silhouette -->
  <g transform="translate(800 250)" fill="#d4b40a" fill-opacity="0.55">
    <rect x="-6" y="20" width="12" height="90" rx="2"/>
    <ellipse cx="0" cy="10" rx="28" ry="36"/>
    <rect x="-40" y="110" width="80" height="8" rx="2" opacity="0.5"/>
  </g>
  <!-- Crowd dots -->
  <g fill="#f3ebd8" fill-opacity="0.12">
    <circle cx="320" cy="430" r="4"/><circle cx="360" cy="445" r="3"/>
    <circle cx="400" cy="435" r="5"/><circle cx="450" cy="450" r="3"/>
    <circle cx="520" cy="440" r="4"/><circle cx="580" cy="455" r="3"/>
    <circle cx="640" cy="438" r="4"/><circle cx="900" cy="442" r="5"/>
    <circle cx="960" cy="450" r="3"/><circle cx="1020" cy="435" r="4"/>
    <circle cx="1100" cy="448" r="3"/><circle cx="1180" cy="440" r="5"/>
  </g>
</svg>
